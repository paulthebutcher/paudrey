<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Sharing card artwork</title>
  <style>
    @font-face{font-family:Instrument;src:url('assets/fonts/instrument-serif-latin-400.woff2')}
    @font-face{font-family:Inter;src:url('assets/fonts/inter-latin-400.woff2')}
    *{box-sizing:border-box}body{margin:0;background:#30261f;color:#f5efe4}
    .card{width:1200px;height:630px;display:grid;grid-template-columns:530px 670px;overflow:hidden}
    .copy{padding:52px 54px;display:flex;flex-direction:column;justify-content:space-between}
    .label{font:15px Inter,sans-serif;letter-spacing:3px;text-transform:uppercase;margin:0}
    h1{font:108px/.96 Instrument,serif;letter-spacing:-2px;font-weight:400;margin:0}
    h1 span{font-size:72px;color:#cbb99e}
    .date{font:27px Instrument,serif;margin:0 0 12px}
    .place{font:14px Inter,sans-serif;letter-spacing:1px;margin:0}
    img{width:670px;height:630px;object-fit:cover;object-position:50% 54%;display:block}
  </style>
</head>
<body>
  <main class="card">
    <div class="copy"><p class="label">Save the date</p><h1>Paul <span>&amp;</span><br>Audrey</h1><div><p class="date">September 25, 2027</p><p class="place">Salt Lake City</p></div></div>
    <img src="assets/images/_Z1A8911-1280.webp" alt="Paul and Audrey sitting together in a golden meadow.">
  </main>
</body>
</html>
